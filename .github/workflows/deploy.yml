# Deploy the editor relay worker (editor.materione.com).
#
# Manual dispatch only — deploys are deliberate owner actions (CLAUDE.md
# Cloudflare cost guardrails; agents never deploy). Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, D1:Edit, and
#                          Zone DNS:Edit for materione.com
#   CLOUDFLARE_ACCOUNT_ID  the account id
# The account stays on the free plan; every product used hard-stops at its
# daily limit rather than billing (web.md §3.3).

name: deploy editor relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: build + deploy worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # One artifact, two homes: this same build is embedded in the plugin
      # jar and served by the worker as static assets.
      # Refuse to deploy an editor that would break a released plugin
      # (fixtures/protocol/released/, build.md §8). The worker tests below
      # include the matching relay check (released-routes.test.ts).
      - name: Editor compatibility with released plugins
        run: |
          node --test scripts/compat/editor-compat.test.mjs
          node scripts/compat/editor-compat.mjs check

      - name: Build editor SPA
        run: ./gradlew :webui:assembleSpa

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/editor-worker/package-lock.json

      - name: Verify worker (types + tests on the real runtime)
        working-directory: cloud/editor-worker
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Apply D1 migrations
        working-directory: cloud/editor-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply editor-relay --remote

      - name: Deploy worker + SPA assets
        working-directory: cloud/editor-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
