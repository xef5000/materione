# CI — mirrors the M0 verification gate (roadmap) and docs/architecture/build.md.
#
# Jobs:
#   build          — unit + ArchUnit tests, shaded jar artifact (every push/PR)
#   integration    — real headless Paper 1.21.4 boot of the shaded jar
#   windows-canary — full suite on Windows; nightly schedule + manual dispatch
#                    only (windows-latest bills 2x Actions minutes, and the
#                    canary is advisory signal, not a gate); non-blocking
#
# No JDK matrix by design: the Java toolchain is pinned to Temurin 21 by the
# build itself (foojay resolver), so every job provisions the same JDK.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full suite including the Windows canary — 04:00 UTC
    # (≈ midnight US Eastern). UTC only; GitHub does not honor DST per zone.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (unit + ArchUnit)
        run: ./gradlew build

      # QA catalog integrity + ledger drift (issue #38) — pure Node, no
      # Minecraft. The in-game suite itself stays a local dev tool.
      - name: QA catalog check
        run: node qa/runner.mjs check

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: materione-plugin
          path: plugin/build/libs/Materione-*.jar
          if-no-files-found: error

  integration:
    name: paper boot (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The pinned Paper server jar (gradle/libs.versions.toml: paper-harness-url
      # + paper-harness-sha256) is cached by content hash — a pin bump is a new key.
      - name: Cache pinned Paper server
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/materione-paper
          key: paper-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: paper-

      - name: Integration test (headless Paper 1.21.4 boot)
        run: ./gradlew :harness:integrationTest

      - name: Upload harness workspaces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-workspaces
          path: harness/build/work/
          if-no-files-found: ignore

  windows-canary:
    name: build (windows canary)
    runs-on: windows-latest
    needs: build
    # Nightly/manual only: pushes and PRs skip this job entirely. When it has
    # been green nightly for a few weeks, reconsider making it required —
    # but remember it is the wall-time critical path (and 2x-billed).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non-blocking by design: promote to required after it has been green for a
    # few weeks (remove continue-on-error and the branch-protection note).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The pinned Paper server jar (gradle/libs.versions.toml pin), cached by
      # content hash — a pin bump is a new key. The path follows
      # GRADLE_USER_HOME because setup-gradle relocates it on Windows runners
      # (observed D:\a\.gradle, not ~/.gradle); cache entries are OS-scoped,
      # so sharing the ubuntu key scheme is safe.
      - name: Cache pinned Paper server
        uses: actions/cache@v4
        with:
          path: ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/materione-paper
          key: paper-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: paper-

      - name: Build + integration (canary)
        run: ./gradlew build :harness:integrationTest
