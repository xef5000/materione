# CI — mirrors the M0 verification gate (roadmap) and docs/architecture/build.md.
#
# Jobs:
#   build          — unit + ArchUnit tests, shaded jar artifact (every push/PR)
#   integration    — real headless Paper 1.21.4 boot of the shaded jar
#   cloud          — editor relay Worker: vitest on the Workers runtime + deploy dry-run
#   windows-canary — full suite on Windows; nightly schedule + manual dispatch
#                    only (windows-latest bills 2x Actions minutes, and the
#                    canary is advisory signal, not a gate); non-blocking
#
# No JDK matrix by design: the Java toolchain is pinned to Temurin 21 by the
# build itself (foojay resolver), so every job provisions the same JDK.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full suite including the Windows canary — 04:00 UTC
    # (≈ midnight US Eastern). UTC only; GitHub does not honor DST per zone.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (unit + ArchUnit)
        run: ./gradlew build

      # QA catalog integrity + ledger drift (issue #38) — pure Node, no
      # Minecraft. The in-game suite itself stays a local dev tool.
      - name: QA catalog check
        run: |
          node --test qa/evidence-redaction.test.mjs
          node qa/runner.mjs check

      # Artifacts bill against the Actions storage quota (500 MB on the
      # free plan). The jar is reproducible from any commit; two days of
      # history keeps a testable build around while several runs per day
      # stay an order of magnitude under the ceiling.
      # continue-on-error: a blown storage quota takes 6-12h for GitHub's
      # billing cron to clear after deletion and must never block the build
      # or downstream integration job (which builds from source via Gradle).
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: materione-plugin
          path: plugin/build/libs/Materione-*.jar
          if-no-files-found: error
          retention-days: 2

  integration:
    name: paper boot (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The pinned Paper server jar (gradle/libs.versions.toml: paper-harness-url
      # + paper-harness-sha256) is cached by content hash — a pin bump is a new key.
      - name: Cache pinned Paper server
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/materione-paper
          key: paper-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: paper-

      - name: Integration test (headless Paper 1.21.4 boot)
        run: ./gradlew :harness:integrationTest

      # A failed boot keeps a debug copy — logs, configs and test reports
      # only. The ~200 MB libraries/cache/plugins boilerplate inside each
      # workspace is re-creatable and it compounded: yesterday's flakes
      # accumulated ~8 GB of workspace dumps and blew GitHub Free's storage
      # quota, red-flagging uploads on unrelated PRs.
      - name: Upload harness debug bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-debug
          path: |
            harness/build/work/*/logs/
            harness/build/work/*/stdout.log
            harness/build/work/*/config/
            harness/build/work/*/plugins/*.yml
            harness/build/test-results/
            harness/build/reports/
            harness/build/probe/**/client.log
          if-no-files-found: ignore
          retention-days: 7

  cloud:
    name: relay worker (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The worker serves the SPA as static assets — build it first (hermetic
      # Node via Gradle, same as the jar embed).
      - name: Build editor SPA
        run: ./gradlew :webui:assembleSpa

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/editor-worker/package-lock.json

      - name: Worker tests (real Workers runtime + local D1)
        working-directory: cloud/editor-worker
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      # Bundle + config validation only; deploys are the owner's, via the
      # manual deploy.yml workflow (CLAUDE.md cost guardrails).
      - name: Wrangler dry-run
        working-directory: cloud/editor-worker
        run: npx wrangler deploy --dry-run --outdir dist

  windows-canary:
    name: build (windows canary)
    runs-on: windows-latest
    needs: build
    # Nightly/manual only: pushes and PRs skip this job entirely. When it has
    # been green nightly for a few weeks, reconsider making it required —
    # but remember it is the wall-time critical path (and 2x-billed).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non-blocking by design: promote to required after it has been green for a
    # few weeks (remove continue-on-error and the branch-protection note).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The pinned Paper server jar (gradle/libs.versions.toml pin), cached by
      # content hash — a pin bump is a new key. The path follows
      # GRADLE_USER_HOME because setup-gradle relocates it on Windows runners
      # (observed D:\a\.gradle, not ~/.gradle); cache entries are OS-scoped,
      # so sharing the ubuntu key scheme is safe.
      - name: Cache pinned Paper server
        uses: actions/cache@v4
        with:
          path: ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/materione-paper
          key: paper-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: paper-

      - name: Build + integration (canary)
        run: ./gradlew build :harness:integrationTest
