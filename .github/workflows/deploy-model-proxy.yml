# Deploy the assistant model proxy worker (ai.materione.com).
#
# Manual dispatch only — deploys are deliberate owner actions (CLAUDE.md
# Cloudflare cost guardrails; agents never deploy). Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, D1:Edit, and
#                          Zone DNS:Edit for materione.com (the same token
#                          deploy.yml uses)
#   CLOUDFLARE_ACCOUNT_ID  the account id
# This workflow never touches Worker secrets, AI Gateway limits, or billing;
# those stay owner dashboard / `wrangler secret` actions (README.md, owner setup).
# When a change spans both, deploy the editor (deploy.yml) first.

name: deploy model proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-model-proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: verify + deploy worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/model-proxy/package-lock.json

      - name: Verify worker (types + tests on the real runtime)
        working-directory: cloud/model-proxy
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Apply D1 migrations
        working-directory: cloud/model-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply model-proxy-allowance --remote

      - name: Deploy worker
        working-directory: cloud/model-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
