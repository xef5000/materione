# Materione version catalog — single source of truth for dependency pins.
# Version facts verified 2026-08-19 (see docs/architecture/build.md).

[versions]
junit = "5.14.4"
junit-launcher = "1.14.4"
assertj = "3.27.7"
archunit = "1.5.0"
# The D10 floor, deliberately not current stable: compiling everything against
# the floor makes post-floor APIs structurally unreachable outside platform/.
paper-api = "1.21.4-R0.1-SNAPSHOT"
# The modern seam (:modern only, the D10 exception): registry-event APIs for
# painting variants and jukebox songs exist only on Paper 1.21.6+ — 26.x-era
# coordinates. Pinned to the same build the scratch server runs (26.1.2 b74).
# Runtime feature detection (RegistryCapabilities), not version strings,
# decides which seam executes; the floor server never loads these classes.
paper-api-modern = "26.1.2.build.74-stable"
# SnakeYAML 2.2 is the exact version Paper 1.21.4 ships at runtime; compileOnly.
snakeyaml = "2.2"
# Gson is the exact major Paper ships at runtime (version.json parsing);
# compileOnly like the rest of the server-provided surface.
gson = "2.11.0"
# Resource-pack output emitter (MIT). The Nexo-maintained fork of
# team.unnamed/creative — same coordinates, actively tracked against new
# Minecraft versions (1.14.4 emits pack.mcmeta min_format/max_format, the
# schema 25w31a+ clients require; upstream 1.7.3 predates it). Shaded +
# relocated under materione.libs.team.unnamed.creative — see plugin-conventions.
creative = "1.14.4"
# Embedded HTTP+WS server for the editor transport (Apache-2.0). Undertow's
# embedded API has been stable across its whole 2.x line, which matters more
# than feature breadth for a shaded listener we must support for years
# (Jetty's 12.x websocket API churn ruled it out — verified empirically).
# Shaded + relocated under materione.libs.* (see plugin-conventions) — M3
# amendment to the shading policy, recorded in build.md §4. Only the web/
# module may touch these types (ban rule R8).
undertow = "2.3.26.Final"

# Harness server pin — single source of truth for CI + integration tests.
# The old api.papermc.io v2 API is 410 Gone; the absolute URL + sha256 below
# keep the harness hermetic (zero API calls at test time).
# Bump with: ./gradlew :harness:printLatestPaperPin
paper-harness-version = "1.21.4"
paper-harness-build = "232"
paper-harness-url = "https://fill-data.papermc.io/v1/objects/5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc/paper-1.21.4-232.jar"
paper-harness-sha256 = "5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
paper-api-modern = { module = "io.papermc.paper:paper-api", version.ref = "paper-api-modern" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
creative-api = { module = "team.unnamed:creative-api", version.ref = "creative" }
creative-serializer-minecraft = { module = "team.unnamed:creative-serializer-minecraft", version.ref = "creative" }
creative-server = { module = "team.unnamed:creative-server", version.ref = "creative" }
undertow-core = { module = "io.undertow:undertow-core", version.ref = "undertow" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[bundles]
materione-test = ["junit-jupiter", "assertj-core", "archunit-junit5"]
