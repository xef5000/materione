# `durable:` on input slots layers (gui-input-durability.md section 10, row S of #247). Golden for the lossless
# round trip: load -> untouched save is byte-identical; `durable` absent stays absent (best_effort is the implicit
# default), `durable` present is kept as written, and the unknown field survives. The runtime reads `durable`
# (row P of #247): required takes the escrow path, best_effort the journal.
vault:
  title: Vault
  container: chest_3
  layers:
    - id: plain_wells            # no durable: key; reading it as best_effort writes nothing back
      type: slots
      region: container
      input: true
    - id: strict_wells           # asks for the escrow path (refused where the platform cannot support it)
      type: slots
      region: container
      input: true
      durable: required
      materione:note: kept untouched
    - id: loose_wells
      type: slots
      region: container
      input: true
      durable: best_effort
