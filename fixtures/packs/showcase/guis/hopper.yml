# The hopper GUI of the showcase (gui.md section 12, row Q): a hopper, five slots in one row, opened by name
# (`materione gui open showcase:hopper <player>`; it has no open command). Each slot holds a button, and one click rule
# names every click on the console by slot id (`say MATERIONE-SHOWCASE-HOPPER-CLICK slot=N`), so a click on each slot
# id is announced in turn. A click outside the window is announced as `MATERIONE-SHOWCASE-HOPPER-OUTSIDE`. The title row
# shows the server's emerald stock as a text layer; the window's clock (refresh: 20) re-renders it, so a change of the
# stock changes the title with no reopen. Every open is announced as `MATERIONE-SHOWCASE-HOPPER-OPEN`. The QA catalog
# (qa/catalog/guicontainers.mjs) reads these markers.
hopper:
  title: Hopper
  container: hopper
  refresh: 20
  layers:
    - id: frame
      type: panel
      x: 0
      y: 0
      width: 176
      height: 133
    - id: heading
      type: text
      x: 8
      y: 6
      text: "Stock ${vars.server.showcase.stock}"
      font: default
      color: "#404040"
    - id: slot_0
      type: item
      slot: 0
      item: minecraft:emerald
      name: "<green>Slot 0"
    - id: slot_1
      type: item
      slot: 1
      item: minecraft:gold_ingot
      name: "<yellow>Slot 1"
    - id: slot_2
      type: item
      slot: 2
      item: minecraft:iron_ingot
      name: "<white>Slot 2"
    - id: slot_3
      type: item
      slot: 3
      item: minecraft:redstone
      name: "<red>Slot 3"
    - id: slot_4
      type: item
      slot: 4
      item: minecraft:lapis_lazuli
      name: "<blue>Slot 4"
  behavior:
    - on: gui.open
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-HOPPER-OPEN"
            as: console
    - on: gui.click
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-HOPPER-CLICK slot=${click.slot}"
            as: console
    - on: gui.click_outside
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-HOPPER-OUTSIDE ${click.type}"
            as: console
