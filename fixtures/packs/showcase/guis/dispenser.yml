# The dispenser GUI of the showcase (gui.md section 12, row Q): a dispenser, nine slots in a 3 x 3 grid, opened by name
# (`materione gui open showcase:dispenser <player>`; it has no open command). Each slot holds a button, and one click
# rule names every click on the console by slot id (`say MATERIONE-SHOWCASE-DISPENSER-CLICK slot=N`). A click outside
# the window is announced as `MATERIONE-SHOWCASE-DISPENSER-OUTSIDE`, and every open as `MATERIONE-SHOWCASE-DISPENSER-OPEN`.
# The QA catalog (qa/catalog/guicontainers.mjs) reads these markers. The client centres a vanilla dispenser title; the
# compiled title keeps its origin at x 8 with a trailing shift (gui.md section 12.5.3), which the QA reads as titleLabelX.
dispenser:
  title: Dispenser
  container: dispenser
  layers:
    - id: frame
      type: panel
      x: 0
      y: 0
      width: 176
      height: 166
    - id: heading
      type: text
      x: 8
      y: 6
      text: "DISPENSER"
      font: smallcaps
      color: "#404040"
    - id: slot_0
      type: item
      slot: 0
      item: minecraft:emerald
      name: "<green>Slot 0"
    - id: slot_1
      type: item
      slot: 1
      item: minecraft:gold_ingot
      name: "<yellow>Slot 1"
    - id: slot_2
      type: item
      slot: 2
      item: minecraft:iron_ingot
      name: "<white>Slot 2"
    - id: slot_3
      type: item
      slot: 3
      item: minecraft:redstone
      name: "<red>Slot 3"
    - id: slot_4
      type: item
      slot: 4
      item: minecraft:lapis_lazuli
      name: "<blue>Slot 4"
    - id: slot_5
      type: item
      slot: 5
      item: minecraft:coal
      name: "<dark_gray>Slot 5"
    - id: slot_6
      type: item
      slot: 6
      item: minecraft:quartz
      name: "<white>Slot 6"
    - id: slot_7
      type: item
      slot: 7
      item: minecraft:amethyst_shard
      name: "<light_purple>Slot 7"
    - id: slot_8
      type: item
      slot: 8
      item: minecraft:diamond
      name: "<aqua>Slot 8"
  behavior:
    - on: gui.open
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-DISPENSER-OPEN"
            as: console
    - on: gui.click
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-DISPENSER-CLICK slot=${click.slot}"
            as: console
    - on: gui.click_outside
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-DISPENSER-OUTSIDE ${click.type}"
            as: console
