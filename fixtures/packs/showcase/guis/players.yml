# The paged player list with search (logic.md §1 rows: list component, paging, prompt, list search). The list shows the
# online players, sorted by name, seven to a page. The search button asks for a name in chat through the prompt (the
# answer goes to session.search, the window comes back with it), and the list keeps the entries whose name contains
# the answer. The clear button empties the search. The arrows page the list, and the indicator reads the page state
# ("Page 2 of 3"). A click on an entry names the player in chat. Announced on the console (`say MATERIONE-SHOWCASE-...`).
players:
  title: Players
  rows: 3
  layers:
    - id: heading
      type: text
      x: 8
      y: 6
      text: "PLAYERS"
      font: smallcaps
      color: "#404040"
    - id: list
      type: list
      slots: { from: 10, to: 16 }
      source: online_players
      sort: name
      search: { fields: [name] }
      entry:
        item: minecraft:player_head
        name: "<yellow>${entry.name}"
        lore: ["<gray>Click to pick"]
    - id: info
      type: item
      slot: 4
      item: minecraft:paper
      name: "<white>Page ${gui.page.list.number} of ${gui.page.list.count}"
      lore: ["<gray>Search: ${gui.session.search}"]
    - id: back
      type: item
      slot: 0
      item: minecraft:arrow
      name: "<gray>Back"
    - id: previous
      type: item
      slot: 18
      item: minecraft:arrow
      name: "<gray>Previous page"
    - id: ask
      type: item
      slot: 20
      item: minecraft:compass
      name: "<white>Search"
    - id: clear
      type: item
      slot: 22
      item: minecraft:barrier
      name: "<gray>Clear search"
    - id: next
      type: item
      slot: 26
      item: minecraft:arrow
      name: "<gray>Next page"
  behavior:
    - on: gui.click
      layer: list
      do:
        - message: "<green>Picked ${entry.name}"
        - run_command:
            command: "say MATERIONE-SHOWCASE-PICK ${entry.name}"
            as: console
    - on: gui.click
      layer: next
      do:
        - gui.page: { list: list, to: next }
    - on: gui.click
      layer: previous
      do:
        - gui.page: { list: list, to: previous }
    - on: gui.click
      layer: ask
      do:
        - prompt: { text: "Type a player name to search, or cancel", var: session.search, timeout: 60 }
          else:
            - message: "<gray>Search cancelled."
        - gui.refresh
    - on: gui.click
      layer: clear
      do:
        - set_var: { var: session.search, value: "" }
        - gui.refresh
    - on: gui.click
      layer: back
      do:
        - gui.back
    - on: gui.page
      layer: list
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-PAGE ${page.index} of ${page.count}"
            as: console
