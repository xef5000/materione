# The settings toggles (logic.md §1 rows: player booleans, conditional items as on and off overlays, click types, opening
# a sub-GUI with arguments, back). The tips button is two item layers in the same slot: a lime dye while show_tips is on,
# a gray dye while it is off. Only one is visible, so the topmost visible layer answers the click, and each flips the
# player's own show_tips boolean. A right click explains the button. The reset button opens the confirm GUI with a
# question argument. Announced on the console (`say MATERIONE-SHOWCASE-...`).
settings:
  title: Settings
  rows: 1
  layers:
    - id: frame
      type: panel
      x: 0
      y: 0
      width: 176
      height: 132
    - id: heading
      type: text
      x: 8
      y: 6
      text: "SETTINGS"
      font: smallcaps
      color: "#404040"
    - id: tips_on
      type: item
      slot: 4
      item: minecraft:lime_dye
      name: "<green>Tips: ON"
      lore: ["<gray>Left click to turn off"]
      visible_if: "vars.player.showcase.show_tips == true"
    - id: tips_off
      type: item
      slot: 4
      item: minecraft:gray_dye
      name: "<gray>Tips: OFF"
      lore: ["<gray>Left click to turn on"]
      visible_if: "vars.player.showcase.show_tips == false"
    - id: reset
      type: item
      slot: 6
      item: minecraft:tnt
      name: "<red>Turn tips off"
    - id: back
      type: item
      slot: 8
      item: minecraft:arrow
      name: "<gray>Back"
  behavior:
    - on: gui.open
      do:
        - run_command:
            command: "say MATERIONE-SHOWCASE-OPEN settings"
            as: console
    - on: gui.click
      layer: tips_on
      click: left
      do:
        - set_var: { var: showcase:show_tips, op: toggle }
        - if:
            var: { var: showcase:show_tips, value: true }
          then:
            - message: "<green>Tips are on."
          else:
            - message: "<red>Tips are off."
        - gui.refresh
    - on: gui.click
      layer: tips_off
      click: left
      do:
        - set_var: { var: showcase:show_tips, op: toggle }
        - if:
            var: { var: showcase:show_tips, value: true }
          then:
            - message: "<green>Tips are on."
          else:
            - message: "<red>Tips are off."
        - gui.refresh
    - on: gui.click
      layer: tips_on
      click: right
      do:
        - message: "<gray>Left click flips this setting."
    - on: gui.click
      layer: tips_off
      click: right
      do:
        - message: "<gray>Left click flips this setting."
    - on: gui.click
      layer: reset
      do:
        - gui.open:
            gui: showcase:confirm
            args:
              question: "<yellow>Turn the tips off?"
    - on: gui.click
      layer: back
      do:
        - gui.back
