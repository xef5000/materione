workbench:
  # The full member surface: barrier collision + interaction hitbox,
  # a seat, a light cell, storage, a label and one timed evolution stage.
  texture: block/workbench
  display_name: Workbench
  rotation: 90
  hitboxes:
    - type: barrier
      offset: [0, 0, 0]
      width: 1.0
      height: 0.9
    - type: interaction
      offset: [0, 0.4, 0]
      width: 1.2
      height: 1.1
  seats:
    - offset: [0, 0.3, 0]
  lights:
    - offset: [0, 1, 0]
      level: 14
  storage: 9
  label: "&eWorkbench"
  evolution:
    - target: world:workbench_aged
      after: 3600
