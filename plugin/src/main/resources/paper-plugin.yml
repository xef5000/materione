name: Materione
version: "@materioneVersion@"
main: dev.materione.plugin.MaterionePlugin
bootstrapper: dev.materione.modern.MaterioneBootstrap
api-version: "1.21"
folia-supported: true
description: Unified content platform - items, blocks, furniture, glyphs, HUDs, menus, packs.
website: https://github.com/xef5000/materione

dependencies:
  server:
    # Soft-depend (logic.md §4.5): the adapters load only when these plugins are enabled.
    # join-classpath lets the adapters see the plugin classes; required false keeps them optional.
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    # The protection adapters (protection.md section 9): each registers a port while its plugin runs, so the plugin loads
    # first and its API is on the adapter's classpath. Optional, like the rest.
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
    Towny:
      load: BEFORE
      required: false
      join-classpath: true
    PlotSquared:
      load: BEFORE
      required: false
      join-classpath: true
    HuskClaims:
      load: BEFORE
      required: false
      join-classpath: true
    HuskTowns:
      load: BEFORE
      required: false
      join-classpath: true
    BentoBox:
      load: BEFORE
      required: false
      join-classpath: true
    # Optional: loaded first when present, so the %materione_…% expansion can register.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
