name: Materione
version: "@materioneVersion@"
main: dev.materione.plugin.MaterionePlugin
api-version: "1.21"
folia-supported: true
description: Unified content platform - items, blocks, furniture, glyphs, HUDs, menus, packs.
website: https://materione.dev
commands:
  materione:
    description: Materione root command (version, doctor, reload, dev, give, browser, editor)
    usage: /materione <version|doctor|reload|dev|give|browser|editor>
permissions:
  materione.editor:
    description: Read diagnostics and open editor sessions (master architecture 9.2 taxonomy)
    default: op
  materione.pipeline:
    description: Trigger reloads and pipeline runs
    default: op
  materione.dev:
    description: World-runtime dev surface (place/remove/inspect/sweep custom blocks)
    default: op
  materione.give:
    description: Hand out live custom items (/materione give, /materione browser)
    default: op
  materione.admin:
    description: Approve editor connections; stop/revoke the editor transport; settings writes
    default: op
